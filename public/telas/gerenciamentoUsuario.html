<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/gerenciamentoUsuario.css">
    <link rel="stylesheet" href="../styles/menu.css">
    <link rel="shortcut icon" href="../img/logo.ico" type="image/x-icon">
    <script src="../js/validacao.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <title>Gerenciamento de Usuários</title>
</head>

<body onload="listarEstufasDisponiveis(); listarUsuariosEstufaPorEmpresa(); validarSessao()">
    <header id="menu">
        <div id="container_header">
            <a href="" id="logo_header">
                <img src="../img/logo.png" alt="Logo Datalumini" style="width: 50px; height: 50px;">
                <span id="nome_header">Datalumini</span>
            </a>
        </div>

        <ul>
            <li>
                <a href="./dashboardPrincipal.html">
                    <span class="texto_selecao">Visão Geral</span>
                </a>
            </li>
            <li>
                <a href="../telas/centralSuporte.html">
                    <span class="texto_selecao">Suporte</span>
                </a>
            </li>
            <li>
                <a href="./gerenciamentoUsuario.html">
                    <span class="texto_selecao">Gerenciamento de Usuários</span>
                </a>
            </li>
            <li>
                <a href="./index.html" onclick="sessionStorage.clear()">
                <span class="texto_selecao">Sair</span>
                </a>
            </li>
        </ul>
    </header>
    <main>
        <section id="secao_gerenciamento_usuarios">

            <div id="titulo_secao">
                <h1>Gerenciamento de Usuários</h1>
                <p>Vincule funcionários às estufas que eles devem monitorar</p>
            </div>
            <div id="form_vinculo">
                <div id="funcionario_estufa">
                    <div>
                        <p id="funcionario_estufa_titulo_numero">
                            Funcionários (0)
                        </p>
                    </div>

                    <div id="funcionario_estufa_lista">
                        <button class="funcionario_estufa_item">Gabriel Farina</button>
                        <button class="funcionario_estufa_item">Guilherme Silva</button>
                        <button class="funcionario_estufa_item">Kaue Tamura</button>
                        <button class="funcionario_estufa_item">Maria Silva</button>
                        <button class="funcionario_estufa_item">João Pereira</button>

                    </div>
                </div>
                <div id="estufa_div">
                    <div>
                        <p id="estufa_titulo_numero">
                            Estufas (0)
                        </p>
                    </div>

                    <div id="estufa_lista">
                        <p style="text-align: center; font-weight: bold;">Selecione um Funcionario para modificar as
                            permições</p>
                    </div>
                </div>
            </div>
        </section>

        <section id="secao_resumo_vinculos">
            <div id="titulo_vinculos">
                <p> Resumo de Vínculos</p>
            </div>

            <div id="container_cards_estufas">

            </div>

        </section>
    </main>

</body>

</html>
<script>
    let jsonFuncionario = [];
    let jsonEstufasDisponiveis = [];

    function listarEstufasDisponiveis() {
        let idEmpresa = sessionStorage.ID_EMPRESA;

        fetch(`/usuarios/listar/estufas/empresa/${idEmpresa}`)
            .then(response => response.json())
            .then(data => {
                jsonEstufasDisponiveis = data;
                estufa_titulo_numero.innerHTML = `Estufas (${data.length})`;

            })
            .catch(error => console.error("Erro ao listar estufas disponíveis:", error));
    }

    function listarUsuariosEstufaPorEmpresa() {
        let idEmpresa = sessionStorage.ID_EMPRESA;

        fetch(`/usuarios/listar/estufas/usuario/${idEmpresa}`)
            .then(response => response.json())
            .then(data => {

                for (let i = 0; i < data.length; i++) {
                    let usuarioJaExiste = false;
                    let indexDoUsuario = -1;

                    for (let j = 0; j < jsonFuncionario.length; j++) {
                        if (jsonFuncionario[j].idUsuario == data[i].idUsuario) {
                            usuarioJaExiste = true;
                            indexDoUsuario = j;
                            break;
                        }
                    }

                    if (!usuarioJaExiste) {
                        jsonFuncionario.push({
                            "idUsuario": data[i].idUsuario,
                            "nome": data[i].nome,
                            "estufas": []
                        });

                        indexDoUsuario = jsonFuncionario.length - 1;
                    }

                    if (data[i].idEstufa != null) {
                        jsonFuncionario[indexDoUsuario].estufas.push({
                            "idEstufa": data[i].idEstufa,
                            "nome": data[i].nomeEstufa
                        });
                    }
                }

                carregarDadosFuncionario();
                setTimeout(carregarFuncionariosPorEstufa, 1000);
            })
            .catch(error => console.error("Erro ao listar usuários por estufa:", error));
    }

    function carregarDadosFuncionario() {
        funcionario_estufa_lista.innerHTML = "";
        let htmlListaFuncionarios = "";

        for (let i = 0; i < jsonFuncionario.length; i++) {
            htmlListaFuncionarios += `
            <li class="funcionario" style="list-style-type: none;">
                <button class="funcionario_estufa_item" onclick="carregarDadosEstufaPorFuncionario(this, ${i})">
                    ${jsonFuncionario[i].nome}
                </button>
            </li>`;
        }

        funcionario_estufa_titulo_numero.innerHTML = `Funcionários (${jsonFuncionario.length})`;

        funcionario_estufa_lista.innerHTML = htmlListaFuncionarios;
    }

    function carregarDadosEstufaPorFuncionario(nomeBotao, indexFuncionario) {
        selecionarFuncionario(nomeBotao);

        let estufasDoFuncionarioSelecionado = jsonFuncionario[indexFuncionario].estufas;

        let htmlListaEstufas = "";

        for (let i = 0; i < jsonEstufasDisponiveis.length; i++) {
            let nomeEstufaDoSistema = jsonEstufasDisponiveis[i].nome;
            let achouEstufa = false;

            for (let j = 0; j < estufasDoFuncionarioSelecionado.length; j++) {
                if (nomeEstufaDoSistema == estufasDoFuncionarioSelecionado[j].nome) {
                    achouEstufa = true;
                    break;
                }
            }

            if (achouEstufa) {
                htmlListaEstufas += `
                <button class="estufa_item" onclick="selecionarEstufa(this, ${indexFuncionario})">
                     ${nomeEstufaDoSistema}
                </button>`;
            } else {
                htmlListaEstufas += `
                <button class="estufa_item estufaIndisponivel" onclick="selecionarEstufa(this, ${indexFuncionario})">
                     ${nomeEstufaDoSistema}
                </button>`;
            }
        }

        estufa_lista.innerHTML = htmlListaEstufas;
    }

    function selecionarFuncionario(nomeBotao) {
        let botoesFuncionarios = document.getElementsByClassName("funcionario_estufa_item");

        for (let i = 0; i < botoesFuncionarios.length; i++) {
            botoesFuncionarios[i].classList.remove("funcionarioSelecionado");
        }

        nomeBotao.classList.add("funcionarioSelecionado");
    }

    function selecionarEstufa(nomeBotao, indexFuncionario) {
        let nomeEstufaSelecionada = nomeBotao.innerText;
        let idEstufaSelecionada = -1;

        for (let i = 0; i < jsonEstufasDisponiveis.length; i++) {
            if (jsonEstufasDisponiveis[i].nome == nomeEstufaSelecionada) {
                idEstufaSelecionada = jsonEstufasDisponiveis[i].idEstufa;
                break;
            }
        }

        if (nomeBotao.classList.contains("estufaIndisponivel")) {

            fetch(`/usuarios/adicionar/estufa`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    usuarioIdServer: jsonFuncionario[indexFuncionario].idUsuario,
                    estufaIdServer: idEstufaSelecionada
                })
            }).catch(error => console.error("Erro ao adicionar estufa ao usuário:", error));

            jsonFuncionario[indexFuncionario].estufas.push({
                idEstufa: idEstufaSelecionada,
                nome: nomeEstufaSelecionada
            });
            nomeBotao.classList.remove("estufaIndisponivel");

        } else {

            fetch(`/usuarios/retirar/estufa`, {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    usuarioIdServer: jsonFuncionario[indexFuncionario].idUsuario,
                    estufaIdServer: idEstufaSelecionada
                })
            }).catch(error => console.error("Erro ao retirar estufa do usuário:", error));

            let indexEstufa = -1;
            for (let i = 0; i < jsonFuncionario[indexFuncionario].estufas.length; i++) {
                if (jsonFuncionario[indexFuncionario].estufas[i].idEstufa == idEstufaSelecionada) {
                    indexEstufa = i;
                    break;
                }
            }

            jsonFuncionario[indexFuncionario].estufas.splice(indexEstufa, 1);
            nomeBotao.classList.add("estufaIndisponivel");
        }

        carregarFuncionariosPorEstufa();
    }

    function carregarFuncionariosPorEstufa() {        
        let htmlEstufas = "";

        for (let i = 0; i < jsonEstufasDisponiveis.length; i++) {

            let nomeEstufa = jsonEstufasDisponiveis[i].nome;
            let idEstufaSistema = jsonEstufasDisponiveis[i].idEstufa;
            let funcionariosDaEstufa = [];

            for (let j = 0; j < jsonFuncionario.length; j++) {
                let estufasDoFuncionario = jsonFuncionario[j].estufas;

                for (let k = 0; k < estufasDoFuncionario.length; k++) {
                    if (idEstufaSistema == estufasDoFuncionario[k].idEstufa) {
                        funcionariosDaEstufa.push(jsonFuncionario[j].nome);
                        break;
                    }
                }
            }

            htmlEstufas += `
                <div class="card_estufa">
                    <div>
                        <p class="card_titulo">${nomeEstufa}</p>
                    </div>
                    <p class="num_funcionarios">${funcionariosDaEstufa.length} funcionarios</p>
                    <ul class="lista_funcionarios">`;

            for (let l = 0; l < funcionariosDaEstufa.length; l++) {
                htmlEstufas += `
                        <li class="listaFuncionarioEstufa"><button> ${funcionariosDaEstufa[l]}</button></li>`;
            }
            htmlEstufas += `
                    </ul>
                </div>
            `;
        }
        
        container_cards_estufas.innerHTML = htmlEstufas;
    }
</script>
