        <div class="chatbot_menu">
            <div class="container_chat">

                <div class="superior_chat">

                    <div class="conteudo_superior_chat">

                        <div class="svg_chat">
<img src="../img/imagembobia.png" alt="BobIA" class="avatar-bobia">
                        </div>

                        <div>
                            <h1>Chatbot BobIA</h1>
                            <p>Assistente Inteligente - Acesso Exclusivo Nível 3</p>
                        </div>



                    </div>

                </div>

                <div id="chat" class="chat">

                </div>

                <div class="escrever_chat">
                    <form class="chat-form" onsubmit="return false;">
                        <input type="text" class="chat-input" id="pergunta"
                            placeholder="Digite sua mensagem para Bobia...">
                        <button onclick="gerarResposta()" class="botao_enviar" type="submit">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M22 2L11 13" stroke="white" stroke-width="2" stroke-linecap="round"

                                <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <span>Enviar</span>
                        </button>
                    </form>
                </div>

            </div>
        </div>

    </main>
    <script>

        async function gerarResposta() {
            const pergunta = document.getElementById('pergunta').value;
            const chatDiv = document.getElementById('chat');

            chatDiv.innerText = "Pensando...";

            const response = await fetch('/perguntar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ pergunta })
            });

            const data = await response.json();

            chatDiv.innerText = data.resultado;
        }

    </script>
